<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Калькулятор ресурсов для предметов</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
  label { display: block; margin-top: 10px; }
  input { width: 100px; margin-left: 10px; }
  button { margin-top: 15px; padding: 8px 15px; }
  .result { margin-top: 20px; background: #f0f0f0; padding: 15px; border-radius: 5px; }
</style>
</head>
<body>

<h1>Калькулятор ресурсов для создания предметов</h1>

<div>
  <label>Белые ресурсы: <input type="number" id="white" value="30000" min="0" /></label>
  <label>Зеленые ресурсы: <input type="number" id="green" value="1600011" min="0" /></label>
  <label>Синие ресурсы: <input type="number" id="blue" value="5000" min="0" /></label>
</div>

<button id="calculateBtn">Рассчитать</button>

<div class="result" id="result"></div>

<script>
  // Константы (стоимость предмета и курсы обмена)
  const COST_WHITE = 86;
  const COST_GREEN = 45;
  const COST_BLUE = 33;

  const GREEN_TO_BLUE_RATE = 6.25; // 1 синий = 6.25 зеленых
  const WHITE_TO_BLUE_RATE = 12.5; // 1 синий = 12.5 белых

  function canCreate(items, resources, costs, rates, allowExchange) {
    const { white, green, blue } = resources;
    const { white: wCost, green: gCost, blue: bCost } = costs;
    const { greenToBlueRate, whiteToBlueRate } = rates;

    let needWhite = items * wCost;
    let needGreen = items * gCost;
    let needBlue = items * bCost;

    let remWhite = white - needWhite;
    let remGreen = green - needGreen;
    let availableBlue = blue;

    let deficitBlue = needBlue - availableBlue;

    if (deficitBlue <= 0) {
      // Синих хватает, обмен не нужен
      return {
        possible: true,
        usedWhite: needWhite,
        usedGreen: needGreen,
        usedBlue: needBlue,
        exchangedWhite: 0,
        exchangedGreen: 0,
        remainWhite: remWhite,
        remainGreen: remGreen,
        remainBlue: availableBlue - needBlue,
      };
    }

    if (!allowExchange) {
      // Обмен запрещён, но синих не хватает — нельзя создать
      return { possible: false };
    }

    // Рассчитываем минимально необходимые обмены чтобы покрыть дефицит синих

    // Сначала пытаемся покрыть дефицит зелёными (обмен кратен 50)
    let greenNeeded = Math.min(remGreen, Math.ceil(deficitBlue * greenToBlueRate / 50) * 50);
    let blueFromGreen = greenNeeded / greenToBlueRate;
    let remainingDeficit = deficitBlue - blueFromGreen;

    let whiteNeeded = 0;
    if (remainingDeficit > 0) {
      // Покрываем остаток белыми (обмен кратен 100)
      whiteNeeded = Math.min(remWhite, Math.ceil(remainingDeficit * whiteToBlueRate / 100) * 100);
      let blueFromWhite = whiteNeeded / whiteToBlueRate;
      remainingDeficit -= blueFromWhite;
    }

    if (remainingDeficit > 0) {
      // Не хватает ресурсов для обмена
      return { possible: false };
    }

    // Проверяем, что не используем больше ресурсов, чем есть
    if (greenNeeded > remGreen || whiteNeeded > remWhite) {
      return { possible: false };
    }

    remGreen -= greenNeeded;
    remWhite -= whiteNeeded;
    availableBlue += (greenNeeded / greenToBlueRate) + (whiteNeeded / whiteToBlueRate);

    if (availableBlue < needBlue) return { possible: false };

    return {
      possible: true,
      usedWhite: needWhite + whiteNeeded,
      usedGreen: needGreen + greenNeeded,
      usedBlue: needBlue,
      exchangedWhite: whiteNeeded,
      exchangedGreen: greenNeeded,
      remainWhite: remWhite,
      remainGreen: remGreen,
      remainBlue: availableBlue - needBlue,
    };
  }

  function maxItems(resources, costs, rates) {
    let left = 0;
    // Верхняя граница для бинарного поиска — грубо, по белым, зеленым и синим ресурсам
    let right = Math.floor(resources.white / costs.white) + 
                Math.floor(resources.green / costs.green) + 
                Math.floor(resources.blue / costs.blue);

    let bestResult = null;
    let bestCount = 0;

    while (left <= right) {
      const mid = Math.floor((left + right) / 2);

      // Проверяем без обмена
      const noExchange = canCreate(mid, resources, costs, rates, false);
      // Проверяем с обменом
      const withExchange = canCreate(mid, resources, costs, rates, true);

      // Выбираем лучший вариант, если он есть
      let candidate = null;
      if (noExchange.possible && withExchange.possible) {
        // Выбираем вариант с максимальным использованием ресурсов (чтобы максимизировать обмены)
        candidate = (withExchange.usedWhite + withExchange.usedGreen) > (noExchange.usedWhite + noExchange.usedGreen)
          ? withExchange
          : noExchange;
      } else if (noExchange.possible) {
        candidate = noExchange;
      } else if (withExchange.possible) {
        candidate = withExchange;
      }

      if (candidate) {
        bestResult = candidate;
        bestCount = mid;
        left = mid + 1;
      } else {
        right = mid - 1;
      }
    }

    return { count: bestCount, details: bestResult };
  }

  document.getElementById('calculateBtn').addEventListener('click', () => {
    const white = parseInt(document.getElementById('white').value, 10) || 0;
    const green = parseInt(document.getElementById('green').value, 10) || 0;
    const blue = parseInt(document.getElementById('blue').value, 10) || 0;

    const resources = { white, green, blue };
    const costs = { white: COST_WHITE, green: COST_GREEN, blue: COST_BLUE };
    const rates = { greenToBlueRate: GREEN_TO_BLUE_RATE, whiteToBlueRate: WHITE_TO_BLUE_RATE };

    const result = maxItems(resources, costs, rates);

    const r = result.details;
    const count = result.count;

    const resDiv = document.getElementById('result');
    if (!r || !r.possible || count === 0) {
      resDiv.innerHTML = `<strong>Невозможно создать ни одного предмета с текущими ресурсами.</strong>`;
      return;
    }

resDiv.innerHTML = `
  <strong>Максимальное количество предметов:</strong> ${count} <br/>
  <strong>Использовано ресурсов:</strong><br/>
  &nbsp;&nbsp;Белых: ${r.usedWhite} (обменено: ${r.exchangedWhite})<br/>
  &nbsp;&nbsp;Зеленых: ${r.usedGreen} (обменено: ${r.exchangedGreen})<br/>
  &nbsp;&nbsp;Синих: ${r.usedBlue}<br/>
  <strong>Остаток ресурсов после создания:</strong><br/>
  &nbsp;&nbsp;Белых: ${Math.floor(r.remainWhite)}<br/>
  &nbsp;&nbsp;Зеленых: ${Math.floor(r.remainGreen)}<br/>
  &nbsp;&nbsp;Синих: ${Math.floor(r.remainBlue)}<br/>
  <strong>Количество обменов:</strong><br/>
  &nbsp;&nbsp;Белых на синие: ${Math.floor(r.exchangedWhite / 100)}<br/>
  &nbsp;&nbsp;Зеленых на синие: ${Math.floor(r.exchangedGreen / 50)}
`;

  });
</script>
