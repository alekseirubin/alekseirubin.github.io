<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Калькулятор создания предметов</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; }
  label { display: block; margin-top: 10px; }
  input { width: 100%; padding: 5px; font-size: 1em; }
  button { margin-top: 15px; padding: 10px 15px; font-size: 1em; }
  .result { margin-top: 20px; background: #f0f0f0; padding: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Калькулятор создания предметов</h1>

<label>Количество белых ресурсов:
  <input type="number" id="white" value="30000" min="0" />
</label>
<label>Количество зеленых ресурсов:
  <input type="number" id="green" value="15000" min="0" />
</label>
<label>Количество синих ресурсов:
  <input type="number" id="blue" value="5000" min="0" />
</label>

<button id="calcBtn">Рассчитать максимум предметов</button>

<div class="result" id="result"></div>

<script>
(() => {
  // Константы
  const COST_WHITE = 86;
  const COST_GREEN = 45;
  const COST_BLUE = 33;

  const RATE_WHITE_TO_BLUE = 12.5;
  const RATE_GREEN_TO_BLUE = 6.25;

  const EXCHANGE_STEP_WHITE = 100;
  const EXCHANGE_STEP_GREEN = 50;

  // Функция расчета с обменом по приоритету
  function calculate(white, green, blue) {
    let maxItems = 0;
    let bestResult = null;

    // Сначала пытаемся без обмена
    const baseItems = Math.min(
      Math.floor(white / COST_WHITE),
      Math.floor(green / COST_GREEN),
      Math.floor(blue / COST_BLUE)
    );
    maxItems = baseItems;

    let usedWhite = baseItems * COST_WHITE;
    let usedGreen = baseItems * COST_GREEN;
    let usedBlue = baseItems * COST_BLUE;

    white -= usedWhite;
    green -= usedGreen;
    blue -= usedBlue;

    let exchangedWhite = 0;
    let exchangedGreen = 0;

    // Попробуем увеличить количество предметов
    while (true) {
      const needWhite = COST_WHITE;
      const needGreen = COST_GREEN;
      const needBlue = COST_BLUE;

      if (white < needWhite || green < needGreen) break;

      if (blue >= needBlue) {
        // хватает синих
        white -= needWhite;
        green -= needGreen;
        blue -= needBlue;
        maxItems++;
        usedWhite += needWhite;
        usedGreen += needGreen;
        usedBlue += needBlue;
        continue;
      }

      // не хватает синих — считаем, сколько нужно
      const deficitBlue = needBlue - blue;

      // сколько нужно белых и зелёных для покрытия
      const neededWhite = Math.ceil(deficitBlue * RATE_WHITE_TO_BLUE / EXCHANGE_STEP_WHITE) * EXCHANGE_STEP_WHITE;
      const neededGreen = Math.ceil(deficitBlue * RATE_GREEN_TO_BLUE / EXCHANGE_STEP_GREEN) * EXCHANGE_STEP_GREEN;

      // определим, какого ресурса больше — его и обменяем
      if (white >= neededWhite || green >= neededGreen) {
        if (white / EXCHANGE_STEP_WHITE >= green / EXCHANGE_STEP_GREEN) {
          // белых больше — меняем белые
          if (white >= neededWhite) {
            white -= neededWhite;
            exchangedWhite += neededWhite;
            blue += neededWhite / RATE_WHITE_TO_BLUE;
          } else break;
        } else {
          // зеленых больше — меняем зеленые
          if (green >= neededGreen) {
            green -= neededGreen;
            exchangedGreen += neededGreen;
            blue += neededGreen / RATE_GREEN_TO_BLUE;
          } else break;
        }
      } else {
        break; // ресурсов на обмен нет
      }
    }

    return {
      count: maxItems,
      usedWhite: usedWhite + exchangedWhite,
      usedGreen: usedGreen + exchangedGreen,
      usedBlue: usedBlue,
      remainWhite: white,
      remainGreen: green,
      remainBlue: Math.floor(blue),
      exchangedWhite,
      exchangedGreen
    };
  }

  // Обработчик кнопки
  function update() {
    const white = parseInt(document.getElementById("white").value) || 0;
    const green = parseInt(document.getElementById("green").value) || 0;
    const blue = parseInt(document.getElementById("blue").value) || 0;

    const res = calculate(white, green, blue);

    const resultDiv = document.getElementById("result");

	if (!res || res.count <= 0) {
	  resultDiv.textContent = "Невозможно создать ни одного предмета с имеющимися ресурсами.";
	  return;
	}


    resultDiv.innerHTML = `
Максимальное количество предметов: ${res.count}

Использовано ресурсов:
  Белых: ${res.usedWhite}
  Зеленых: ${res.usedGreen}
  Синих: ${res.usedBlue}

Остаток ресурсов после создания:
  Белых: ${res.remainWhite}
  Зеленых: ${res.remainGreen}
  Синих: ${res.remainBlue}

Количество обменов:
  Белых на синие: ${res.exchangedWhite / EXCHANGE_STEP_WHITE}
  Зеленых на синие: ${res.exchangedGreen / EXCHANGE_STEP_GREEN}
    `;
  }

  document.getElementById("calcBtn").addEventListener("click", update);
})();
</script>
