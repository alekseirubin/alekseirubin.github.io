<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Калькулятор создания предметов</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; }
  label { display: block; margin-top: 10px; }
  input { width: 100%; padding: 5px; font-size: 1em; }
  button { margin-top: 15px; padding: 10px 15px; font-size: 1em; }
  .result { margin-top: 20px; background: #f0f0f0; padding: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Калькулятор создания предметов</h1>

<label>Количество белых ресурсов:
  <input type="number" id="white" value="30000" min="0" />
</label>
<label>Количество зеленых ресурсов:
  <input type="number" id="green" value="1600011" min="0" />
</label>
<label>Количество синих ресурсов:
  <input type="number" id="blue" value="5000" min="0" />
</label>

<button id="calcBtn">Рассчитать максимум предметов</button>

<div class="result" id="result"></div>

<script>
(() => {
  // Константы
  const COST_WHITE = 86;
  const COST_GREEN = 45;
  const COST_BLUE = 33;

  const RATE_WHITE_TO_BLUE = 12.5; // 1 синий = 12.5 белых
  const RATE_GREEN_TO_BLUE = 6.25; // 1 синий = 6.25 зеленых

  const EXCHANGE_STEP_WHITE = 100; // обмен белых кратно 100
  const EXCHANGE_STEP_GREEN = 50;  // обмен зеленых кратно 50

  // Функция для вычисления максимума без обмена
  function maxWithoutExchange(white, green, blue) {
    return Math.min(
      Math.floor(white / COST_WHITE),
      Math.floor(green / COST_GREEN),
      Math.floor(blue / COST_BLUE)
    );
  }

  // Функция для проверки можно ли создать заданное количество предметов с задаными ресурсами и обменом
  // Возвращает null если невозможно
  function canCreate(items, white, green, blue, exchangedWhite = 0, exchangedGreen = 0) {
    // Потрачено белых и зеленых на обмен
    if (exchangedWhite > white || exchangedGreen > green) return null;

    // Синие после обмена
    const blueAfterExchange = blue + exchangedWhite / RATE_WHITE_TO_BLUE + exchangedGreen / RATE_GREEN_TO_BLUE;

    // Нужно ресурсов для предметов
    const needWhite = items * COST_WHITE;
    const needGreen = items * COST_GREEN;
    const needBlue = items * COST_BLUE;

    // Остаток после создания с учетом обмена (обмен ресурсы уже вычли)
    const remainWhite = white - needWhite - exchangedWhite;
    const remainGreen = green - needGreen - exchangedGreen;
    const remainBlue = blueAfterExchange - needBlue;

    if (remainWhite < 0 || remainGreen < 0 || remainBlue < 0) return null;

    return {
      usedWhite: needWhite + exchangedWhite,
      usedGreen: needGreen + exchangedGreen,
      usedBlue: needBlue,
      remainWhite,
      remainGreen,
      remainBlue,
      exchangedWhite,
      exchangedGreen
    };
  }

  // Поиск максимума с обменом (перебор вариантов обмена с шагами)
  function findMaxWithExchange(white, green, blue) {
    let maxItems = 0;
    let bestResult = null;

    // Максимально возможное количество обменов (с запасом, чтобы не перебирать слишком много)
    const maxExWhite = Math.floor(white / EXCHANGE_STEP_WHITE) * EXCHANGE_STEP_WHITE;
    const maxExGreen = Math.floor(green / EXCHANGE_STEP_GREEN) * EXCHANGE_STEP_GREEN;

    // Перебираем обмен белых и зеленых в разумных пределах (например, с шагом обмена)
    // Ограничиваем перебор по количеству обменов, чтобы не было слишком долго
    // Оптимально перебирать обмен белых от 0 до maxExWhite с шагом EXCHANGE_STEP_WHITE
    // И обмен зеленых от 0 до maxExGreen с шагом EXCHANGE_STEP_GREEN

    for (let exchangedWhite = 0; exchangedWhite <= maxExWhite; exchangedWhite += EXCHANGE_STEP_WHITE) {
      for (let exchangedGreen = 0; exchangedGreen <= maxExGreen; exchangedGreen += EXCHANGE_STEP_GREEN) {
        // Сколько синих будет после обмена
        const blueAfterExchange = blue + exchangedWhite / RATE_WHITE_TO_BLUE + exchangedGreen / RATE_GREEN_TO_BLUE;

        // Максимум предметов можно создать с текущим обменом
        const maxByWhite = Math.floor((white - exchangedWhite) / COST_WHITE);
        const maxByGreen = Math.floor((green - exchangedGreen) / COST_GREEN);
        const maxByBlue = Math.floor(blueAfterExchange / COST_BLUE);

        const possibleItems = Math.min(maxByWhite, maxByGreen, maxByBlue);

        if (possibleItems > maxItems) {
          const res = canCreate(possibleItems, white, green, blue, exchangedWhite, exchangedGreen);
          if (res) {
            maxItems = possibleItems;
            bestResult = res;
          }
        }
      }
    }
    return { maxItems, bestResult };
  }

  // Основная функция расчёта
  function calculate(white, green, blue) {
    const noExchangeMax = maxWithoutExchange(white, green, blue);
    const noExchangeResult = canCreate(noExchangeMax, white, green, blue, 0, 0);

    const { maxItems: withExchangeMax, bestResult: withExchangeResult } = findMaxWithExchange(white, green, blue);

    // Выбираем максимальный результат
    if (withExchangeMax > noExchangeMax) {
      return { count: withExchangeMax, res: withExchangeResult, exchanged: true };
    } else {
      return { count: noExchangeMax, res: noExchangeResult, exchanged: false };
    }
  }

  // Обработчик кнопки
  function update() {
    const white = parseInt(document.getElementById("white").value) || 0;
    const green = parseInt(document.getElementById("green").value) || 0;
    const blue = parseInt(document.getElementById("blue").value) || 0;

    const { count, res, exchanged } = calculate(white, green, blue);

    const resultDiv = document.getElementById("result");

    if (!res) {
      resultDiv.textContent = "Невозможно создать ни одного предмета с имеющимися ресурсами.";
      return;
    }

    resultDiv.innerHTML = `
Максимальное количество предметов: ${count}

Использовано ресурсов:
  Белых: ${res.usedWhite}
  Зеленых: ${res.usedGreen}
  Синих: ${res.usedBlue}

Остаток ресурсов после создания:
  Белых: ${res.remainWhite}
  Зеленых: ${res.remainGreen}
  Синих: ${res.remainBlue}

Количество обменов:
  Белых на синие: ${res.exchangedWhite / EXCHANGE_STEP_WHITE}
  Зеленых на синие: ${res.exchangedGreen / EXCHANGE_STEP_GREEN}

Обмен ${exchanged ? 'выполнен для максимума предметов' : 'не нужен — максимум достигается без обмена'}.
    `;
  }

  document.getElementById("calcBtn").addEventListener("click", update);
})();
</script>
