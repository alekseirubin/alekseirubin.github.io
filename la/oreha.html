<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Калькулятор создания предметов</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    label, input { display: block; margin-bottom: 10px; }
    button { padding: 10px 20px; margin-top: 10px; }
    .result { margin-top: 20px; background: #f9f9f9; padding: 15px; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Калькулятор создания предметов</h1>
  <label>Доступно белых ресурсов: <input type="number" id="white" value="30000" /></label>
  <label>Доступно зеленых ресурсов: <input type="number" id="green" value="16000" /></label>
  <label>Доступно синих ресурсов: <input type="number" id="blue" value="5000" /></label>
  <button onclick="calculate()">Рассчитать</button>
  <div class="result" id="result"></div>

  <script>
    function roundDownTo(value, step) {
      return Math.floor(value / step) * step;
    }

	function canCreate(items, resources, costs, rates) {
	  const { white, green, blue } = resources;
	  const { white: wCost, green: gCost, blue: bCost } = costs;
	  const { greenToBlueRate, whiteToBlueRate } = rates;

	  let needWhite = items * wCost;
	  let needGreen = items * gCost;
	  let needBlue = items * bCost;

	  let remWhite = white - needWhite;
	  let remGreen = green - needGreen;
	  let availableBlue = blue;

	  let deficitBlue = needBlue - availableBlue;

	  if (deficitBlue <= 0) {
		// Синих достаточно без обменов
		return {
		  usedWhite: needWhite,
		  usedGreen: needGreen,
		  usedBlue: needBlue,
		  exchangedWhite: 0,
		  exchangedGreen: 0,
		  remainWhite: remWhite,
		  remainGreen: remGreen,
		  remainBlue: availableBlue - needBlue,
		};
	  }

	  // Максимально возможные обмены
	  const maxGreenExchange = Math.floor(remGreen / 50) * 50;
	  const maxWhiteExchange = Math.floor(remWhite / 100) * 100;

	  let bestGreenUsed = 0;
	  let bestWhiteUsed = 0;
	  let maxTotalUsed = -1;

	  // Перебираем зелёные обмены от максимума к 0 с шагом 50
	  for (let greenUsed = maxGreenExchange; greenUsed >= 0; greenUsed -= 50) {
		const blueFromGreen = greenUsed / greenToBlueRate;
		const remainingBlueNeeded = deficitBlue - blueFromGreen;

		if (remainingBlueNeeded <= 0) {
		  // Зелёных хватает, белые не нужны
		  if (greenUsed > maxTotalUsed) {
			bestGreenUsed = greenUsed;
			bestWhiteUsed = 0;
			maxTotalUsed = greenUsed;
		  }
		  continue;
		}

		// Сколько белых нужно для оставшегося дефицита синих
		let whiteNeeded = remainingBlueNeeded * whiteToBlueRate;
		whiteNeeded = Math.ceil(whiteNeeded / 100) * 100; // округляем вверх к 100

		if (whiteNeeded <= maxWhiteExchange) {
		  const totalUsed = greenUsed + whiteNeeded;
		  if (totalUsed > maxTotalUsed) {
			bestGreenUsed = greenUsed;
			bestWhiteUsed = whiteNeeded;
			maxTotalUsed = totalUsed;
		  }
		}
	  }

	  // Если не нашли подходящий вариант — невозможно покрыть дефицит
	  if (maxTotalUsed < 0) return null;

	  // Проверяем, что после обмена ресурсов хватает
	  remGreen -= bestGreenUsed;
	  remWhite -= bestWhiteUsed;
	  availableBlue += (bestGreenUsed / greenToBlueRate) + (bestWhiteUsed / whiteToBlueRate);

	  if (remGreen < 0 || remWhite < 0) return null;

	  deficitBlue = needBlue - availableBlue;
	  if (deficitBlue > 0) return null; // всё ещё не хватает

	  return {
		usedWhite: needWhite + bestWhiteUsed,
		usedGreen: needGreen + bestGreenUsed,
		usedBlue: needBlue,
		exchangedWhite: bestWhiteUsed,
		exchangedGreen: bestGreenUsed,
		remainWhite: remWhite,
		remainGreen: remGreen,
		remainBlue: availableBlue - needBlue,
	  };
	}


    function calculate() {
      const white = parseFloat(document.getElementById("white").value);
      const green = parseFloat(document.getElementById("green").value);
      const blue = parseFloat(document.getElementById("blue").value);

      const costs = { white: 86, green: 45, blue: 33 };
      const rates = { greenToBlueRate: 6.25, whiteToBlueRate: 12.5 };
      const resources = { white, green, blue };

      // Ищем максимум предметов: сначала экспоненциально, потом бинарным поиском
      let low = 0;
      let high = 1;
      while (canCreate(high, resources, costs, rates)) {
        low = high;
        high *= 2;
      }

      let best = null;
      let bestCount = 0;

      while (low <= high) {
        const mid = Math.floor((low + high) / 2);
        const res = canCreate(mid, resources, costs, rates);

        if (res) {
          best = res;
          bestCount = mid;
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }

      if (!best) {
        document.getElementById("result").innerText = "Невозможно создать ни одного предмета с имеющимися ресурсами.";
        return;
      }

      const whiteExchanges = best.exchangedWhite > 0 ? best.exchangedWhite / 100 : 0;
      const greenExchanges = best.exchangedGreen > 0 ? best.exchangedGreen / 50 : 0;

      document.getElementById("result").innerHTML = `
        Максимум предметов: <b>${bestCount}</b>\n
        Потрачено белых: <b>${best.usedWhite.toFixed(2)}</b> (обменяно: ${best.exchangedWhite.toFixed(2)}, обменов: ${whiteExchanges.toFixed(2)})\n
        Потрачено зелёных: <b>${best.usedGreen.toFixed(2)}</b> (обменяно: ${best.exchangedGreen.toFixed(2)}, обменов: ${greenExchanges.toFixed(2)})\n
        Потрачено синих: <b>${best.usedBlue}</b>\n
        Осталось белых: <b>${best.remainWhite.toFixed(2)}</b>\n
        Осталось зелёных: <b>${best.remainGreen.toFixed(2)}</b>\n
        Осталось синих: <b>${best.remainBlue.toFixed(2)}</b>
      `;
    }
  </script>
